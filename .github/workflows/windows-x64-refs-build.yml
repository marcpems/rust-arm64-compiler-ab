name: Windows x64 full PGO release storage comparison

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      pair:
        required: true
        type: number
      cache:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      SOURCE_REVISION: 81b8490e74e2ae24715fd9568ac8eba6b9a3f231
      HEAD_SHA: 81b8490e74e2ae24715fd9568ac8eba6b9a3f231
      CI_JOB_NAME: dist-x86_64-msvc
      DEPLOY: "1"
      DIST_REQUIRE_ALL_TOOLS: "1"
      DIST_TRY_BUILD: "0"
      CODEGEN_BACKENDS: llvm,cranelift
      CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT: "true"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      RUST_CONFIGURE_ARGS: --build=x86_64-pc-windows-msvc --host=x86_64-pc-windows-msvc --target=x86_64-pc-windows-msvc --enable-full-tools --enable-profiler --set rust.codegen-units=1
      SCRIPT: python "$HARNESS_DIR/preflight.py" --output "$RESULTS_DIR" && python x.py build --set rust.debug=true opt-dist && PGO_HOST=x86_64-pc-windows-msvc ./build/x86_64-pc-windows-msvc/stage1-tools-bin/opt-dist windows-ci -- python x.py dist bootstrap --include-default-paths
      SCCACHE_DIR: ${{ inputs.variant == 'refs' && 'R:\compiler-cache' || 'D:\compiler-cache' }}
      SCCACHE_CACHE_SIZE: 40G
      AWS_EC2_METADATA_DISABLED: "true"
      BUILD_SOURCE: ${{ inputs.variant == 'refs' && 'R:\rust-src' || 'D:\rust-src' }}
      HARNESS_DIR: ${{ github.workspace }}\harness\.github\x64-refs
      RESULTS_DIR: ${{ github.workspace }}\results
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.BUILD_SOURCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          sparse-checkout: |
            .github/nvme
            .github/x64-refs
      - name: Audit and apply storage treatment
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          HOST_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\harness\.github\x64-refs\storage.ps1
          $report = Invoke-X64Storage -Variant '${{ inputs.variant }}'
          $report | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\x64-storage.json"
      - name: Disable automatic line-ending conversion
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - name: Checkout fixed compiler source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          fetch-depth: 2
      - name: Use a short physical source path on the selected filesystem
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:HARNESS_DIR\storage.ps1"
          $move = Move-VerifiedDirectory -Source "$env:GITHUB_WORKSPACE\source" -Destination $env:BUILD_SOURCE
          $move | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\source-relocation.json"
          $expected = if ('${{ inputs.variant }}' -eq 'refs') { 'ReFS' } else { 'NTFS' }
          if ((Get-Volume -DriveLetter $env:BUILD_SOURCE.Substring(0,1)).FileSystem -ne $expected) {
            throw 'Short source path is on the wrong filesystem'
          }
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\src" -Target "$env:BUILD_SOURCE\src" | Out-Null
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\src\ci\github-actions\problem_matchers.json")) {
            throw 'Upstream matcher is not visible from the runner workspace'
          }
      - name: Record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:GITHUB_WORKSPACE\results" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\x64-storage.json" "$env:GITHUB_WORKSPACE\results\storage.json"
          Copy-Item "$env:RUNNER_TEMP\source-relocation.json" "$env:RESULTS_DIR\source-relocation.json"
          $source = git rev-parse HEAD
          if ($source -ne $env:SOURCE_REVISION) { throw 'Source mismatch' }
          @{
            source = $source; experiment = '${{ github.sha }}'
            pair = ${{ inputs.pair }}; variant = '${{ inputs.variant }}'; cache = '${{ inputs.cache }}'
            image = $env:ImageOS; imageVersion = $env:ImageVersion
            pilot = (${{ inputs.pair }} -eq 1); runner = 'windows-2025'
            buildSource = $env:BUILD_SOURCE
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\results\provenance.json"
          Copy-Item "$env:HARNESS_DIR\protocol.json" "$env:RESULTS_DIR\protocol.json"
      - name: Apply identical bootstrap runtime-probe correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = "$env:HARNESS_DIR\bootstrap-runtime-probe.patch"
          if (git status --porcelain --untracked-files=no) { throw 'Compiler checkout is not clean before patch' }
          git apply --check --whitespace=error $patch
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap patch does not apply to pinned source' }
          git apply --whitespace=error $patch
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap patch application failed' }
          git diff --exit-code -- src/bootstrap/src/utils/helpers.rs > "$env:RESULTS_DIR\compiler-source.patch"
          if ($LASTEXITCODE -ne 1) { throw 'Expected compiler-source correction is missing' }
          $global:LASTEXITCODE = 0
          $provenance = Get-Content "$env:RESULTS_DIR\provenance.json" -Raw | ConvertFrom-Json
          $provenance | Add-Member -NotePropertyName source_patch_sha256 -NotePropertyValue (Get-FileHash -Algorithm SHA256 $patch).Hash
          $provenance | ConvertTo-Json | Set-Content "$env:RESULTS_DIR\provenance.json"
          Copy-Item $patch "$env:RESULTS_DIR\bootstrap-runtime-probe.patch"
      - name: Restore local compiler cache on fresh VM
        if: inputs.cache == 'restored'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: x64-compiler-cache-${{ inputs.pair }}-${{ inputs.variant }}
          path: ${{ env.SCCACHE_DIR }}
      - name: Enforce cache condition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entries = if (Test-Path -LiteralPath $env:SCCACHE_DIR) {
            @(Get-ChildItem -LiteralPath $env:SCCACHE_DIR -File -Recurse -Force).Count
          } else { 0 }
          if ('${{ inputs.cache }}' -eq 'cold' -and $entries -ne 0) { throw 'Nonempty cold cache' }
          if ('${{ inputs.cache }}' -eq 'restored' -and $entries -eq 0) { throw 'Empty restored cache' }
          @{ requested = '${{ inputs.cache }}'; files = $entries } |
            ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\results\cache-before.json"
      - name: Install upstream sccache
        run: src/ci/scripts/install-sccache.sh
      - name: Install upstream Clang
        run: src/ci/scripts/install-clang.sh
      - name: Install upstream WiX
        run: src/ci/scripts/install-wix.sh
      - name: Preserve upstream submodule line endings
        run: src/ci/scripts/disable-git-crlf-conversion.sh
      - name: Checkout upstream submodules
        run: src/ci/scripts/checkout-submodules.sh
      - name: Install upstream MinGW
        run: src/ci/scripts/install-mingw.sh
      - name: Install upstream Ninja
        run: src/ci/scripts/install-ninja.sh
      - name: Verify line endings
        run: src/ci/scripts/verify-line-endings.sh
      - name: Record effective configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SCCACHE_BUCKET -or $env:DIST_TRY_BUILD -ne '0') { throw 'Unexpected cache or reduced-build mode' }
          @{
            configure = $env:RUST_CONFIGURE_ARGS; script = $env:SCRIPT; backends = $env:CODEGEN_BACKENDS
            cacheDirectory = $env:SCCACHE_DIR; cargoHome = $env:CARGO_HOME
            temp = $env:TEMP; tmp = $env:TMP; runnerTemp = $env:RUNNER_TEMP
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\results\configuration.json"
          git submodule status --recursive > "$env:GITHUB_WORKSPACE\results\submodules.txt"
      - name: Full upstream x64 PGO release and artifact tests
        run: |
          python "$HARNESS_DIR/measure.py" --output "$RESULTS_DIR" --timeout 19800 -- \
            'C:\Program Files\Git\bin\bash.exe' --noprofile --norc -eo pipefail src/ci/scripts/run-build-from-ci.sh
      - name: Verify distribution and extracted compiler
        run: python "$HARNESS_DIR/qualify.py" --output "$RESULTS_DIR"
      - name: Record compiler-cache statistics
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:GITHUB_WORKSPACE\results" -Force | Out-Null
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats --stats-format=json > "$env:GITHUB_WORKSPACE\results\sccache.json"
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              "sccache statistics unavailable: $code" | Set-Content "$env:GITHUB_WORKSPACE\results\sccache-error.txt"
              Write-Warning "sccache statistics unavailable: $code"
            }
          } else {
            'sccache not installed' | Set-Content "$env:GITHUB_WORKSPACE\results\sccache-error.txt"
          }
          $global:LASTEXITCODE = 0
      - name: Stop cache before snapshot
        if: success()
        run: sccache --stop-server
      - name: Save cache for matching restored run
        if: success() && inputs.cache == 'cold'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x64-compiler-cache-${{ inputs.pair }}-${{ inputs.variant }}
          path: ${{ env.SCCACHE_DIR }}
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Preserve failure and final evidence
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory results -Force | Out-Null
          if (Test-Path "$env:RUNNER_TEMP\x64-storage.json") {
            Copy-Item "$env:RUNNER_TEMP\x64-storage.json" results\storage.json
          }
          foreach ($entry in @('bootstrap.toml', 'build\metrics.json')) {
            if (Test-Path "$env:BUILD_SOURCE\$entry") {
              Copy-Item "$env:BUILD_SOURCE\$entry" "results\last-$([IO.Path]::GetFileName($entry))"
            }
          }
          Get-Volume | Select-Object DriveLetter,FileSystem,Size,SizeRemaining |
            ConvertTo-Json | Set-Content results\volumes-after.json
          Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage,PeakUsage |
            ConvertTo-Json | Set-Content results\paging-after.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x64-evidence-${{ inputs.cache }}-${{ inputs.pair }}-${{ inputs.variant }}
          path: ${{ github.workspace }}\results
          retention-days: 14
          if-no-files-found: error
